<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoPub</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="panel">
  <div class="container">

    <main id="mainPage">
    <button id="settingsButton" class="settings-button" aria-label="Ouvrir les parametres" title="Parametres">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.43 7.43 0 0 0 .05-.94 7.43 7.43 0 0 0-.05-.94l2.03-1.58-1.92-3.32-2.39.96a7.15 7.15 0 0 0-1.63-.94L14.87 3h-3.84l-.36 2.18c-.58.23-1.13.54-1.63.94l-2.39-.96-1.92 3.32 2.03 1.58a7.43 7.43 0 0 0-.05.94c0 .32.02.63.05.94l-2.03 1.58 1.92 3.32 2.39-.96c.5.4 1.05.72 1.63.94l.36 2.18h3.84l.36-2.18c.58-.23 1.13-.54 1.63-.94l2.39.96 1.92-3.32-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/></svg>
    </button>

    <div class="header">
      <div class="badge">
        <div class="badge-glow"></div>
        <img src="../icons/icon128.png" alt="Logo NoPUB" />
      </div>

      <p class="eyebrow">Bloqueur de publicités</p>
      <h1>NoPub</h1>

      <div class="status-pill">
        <span class="status-dot"></span>
        <p id="status">Protection active</p>
      </div>
    </div>

    <div class="counter">
      <div class="counter-inner">
        <span>Publicités bloquées</span>
        <strong id="counter">0</strong>
      </div>
    </div>

    <div class="toggle-row">
      <div class="toggle-label">
        <span class="toggle-title">Protection</span>
        <span class="toggle-sub" id="toggleSub">Activée sur ce site</span>
      </div>
      <button id="toggle" class="switch on" aria-pressed="true" aria-label="Activer ou désactiver la protection">
        <span class="switch-thumb"></span>
      </button>
    </div>

    <footer class="popup-footer">
      <span id="version">Version</span>
      <span>© 2026 Cndxe</span>
    </footer>

    </main>

    <section id="settingsPage" class="settings-page" aria-label="Parametres" aria-hidden="true">
      <div class="settings-header">
        <button id="backButton" class="back-button" aria-label="Retour a l'accueil">&#8592;</button>
        <h2>Parametres</h2>
      </div>
      <p class="settings-intro">Personnalisez le comportement de NoPUB.</p>
      <div class="settings">
      <div>
        <span class="toggle-title">Popup d'activation</span>
        <span class="toggle-sub">Afficher le message bref quand NoPUB est active.</span>
      </div>
      <button id="notificationToggle" class="switch on" aria-pressed="true" aria-label="Activer ou desactiver la popup d'activation"><span class="switch-thumb"></span></button>
      </div>
    </section>

  </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
